<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#21160f"><title>ÇAYCIK: Boss Savaşı</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#21160f;color:#fff1cc;font-family:Georgia,serif;touch-action:none}#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:8px;background:radial-gradient(ellipse at 50% 20%,#63402a,#21160f 70%)}#top,#touch{width:min(100%,960px);display:flex;justify-content:space-between;align-items:center;gap:8px}#top{font-size:12px;color:#f2c66a;letter-spacing:1px}#frame{width:min(100%,960px);max-height:calc(100dvh - 150px);aspect-ratio:16/9;border:4px solid #6c4326;border-radius:12px;overflow:hidden;box-shadow:0 12px 50px #0009}canvas{display:block;width:100%;height:100%}.cluster{display:flex;gap:7px}.pad{width:clamp(48px,10vw,70px);height:clamp(48px,10vw,70px);border:2px solid #d8ad58;border-radius:14px;background:linear-gradient(#76502f,#392519);color:#fff1cc;font:bold 18px Georgia;box-shadow:0 4px 0 #1b110b;touch-action:none}.pad.action{font-size:12px;width:clamp(52px,11vw,76px)}.pad:active,.pad.down{transform:translateY(3px);box-shadow:0 1px 0 #1b110b;background:#a05a35}.hint{font-size:11px;color:#d6bd8d;text-align:center}@media(orientation:portrait) and (max-width:700px){#frame{max-height:55dvh}#top{font-size:10px}.cluster{gap:4px}.pad{border-radius:11px}}
</style></head><body><div id="app"><div id="top"><b>☕ ÇAYCIK: BOSS SAVAŞI</b><span>WEB SÜRÜMÜ · 0.1</span></div><div id="frame"><canvas id="game" width="960" height="540"></canvas></div><div id="touch"><div class="cluster"><button class="pad" data-key="left">◀</button><button class="pad" data-key="right">▶</button></div><div class="cluster"><button class="pad action" data-key="jump">ZIPLA</button><button class="pad action" data-key="dash">DASH</button></div><div class="cluster"><button class="pad action" data-key="shoot">ATEŞ</button><button class="pad action" data-key="ex">EX</button></div></div><div class="hint">PC: A/D veya ←/→ · Space zıpla/parry · X ateş · Shift dash · Q EX · R silah değiştir · Esc duraklat</div></div><script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d'),W=960,H=540,F=452;let state='menu',keys={},pressed={},t=0,weapon=0,score=0,best=+(localStorage.caycikBest||0),p,b,shots=[],bullets=[],fx=[],msg='';const wp=[['ÇAY TOPU','#fff',9,'pea',1],['SAÇMA','#ffb347',22,'spread',.7],['TAKİPÇİ','#7ad0ff',12,'home',.55]],alias={left:['a','arrowleft'],right:['d','arrowright'],jump:[' ','z'],shoot:['x','j'],dash:['shift','c'],ex:['q','e','v'],weapon:['r','tab']};function reset(){p={x:170,y:F,vx:0,vy:0,face:1,hp:3,inv:0,dash:0,dc:0,sc:0,card:0,on:true};b={x:770,hp:250,max:250,t:0,phase:1,timer:75,n:0,mode:'idle',flash:0};shots=[];bullets=[];fx=[];weapon=0;score=0;state='fight'}function held(a){return alias[a].some(k=>keys[k])}function hit(a){return alias[a].some(k=>pressed[k])}function key(e,d){let k=e.key.toLowerCase();if([' ','arrowleft','arrowright'].includes(k))e.preventDefault();if(d&&!keys[k])pressed[k]=true;keys[k]=d;if(k==='escape'&&d)state=state==='fight'?'pause':state==='pause'?'fight':state}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));addEventListener('blur',()=>keys={});document.querySelectorAll('.pad').forEach(el=>{let k=el.dataset.key,map={jump:' ',dash:'shift',shoot:'x',ex:'q'};let v=map[k]||k;function down(e){e.preventDefault();keys[v]=true;el.classList.add('down')}function up(e){e.preventDefault();keys[v]=false;el.classList.remove('down')}el.onpointerdown=down;el.onpointerup=up;el.onpointercancel=up;el.onpointerleave=up});
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function circ(x,y,r,col,stroke='#1b1209',lw=3){g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=col;g.fill();if(lw){g.lineWidth=lw;g.strokeStyle=stroke;g.stroke()}}function line(x,y,X,Y,col='#1b1209',w=4){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=col;g.lineWidth=w;g.stroke()}function txt(s,x,y,z=24,col='#fff1cc'){g.font=`bold ${z}px Georgia`;g.textAlign='center';g.fillStyle=col;g.fillText(s,x,y)}function bg(){let q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#f8dc8b');q.addColorStop(1,'#e58c4e');rect(0,0,W,H,q);circ(770,110,54,'#ffe9a0','',0);for(let i=0;i<6;i++){g.fillStyle='#d88954';g.beginPath();g.ellipse(i*190-(t*.25%190)+80,365,130,65,0,0,7);g.fill()}rect(0,F,W,H-F,'#70933d');rect(0,F+10,W,8,'#42632c');for(let i=0;i<40;i++){let x=(i*97-t)%W;line(x,F+10,x-5,F+20,'#42632c',2)}}function frog(){let x=b.x,y=F;circ(x-62,y-18,34,'#3d7a2b');circ(x+62,y-18,34,'#3d7a2b');circ(x,y-72,82,b.flash?'#fff':'#69b043');circ(x,y-52,56,'#e4f09a');for(let d of [-1,1]){circ(x+d*38,y-146,28,'#69b043');circ(x+d*38,y-146,21,'#fffbe8');circ(x+d*38+(p.x-x)*.06,y-146+(p.y-30-(y-146))*.06,8,'#1b1209','',0)}line(x-50,y-96,x,y-82);line(x,y-82,x+50,y-96);g.fillStyle='#f2b632';g.beginPath();g.moveTo(x-25,y-180);g.lineTo(x-25,y-208);g.lineTo(x,y-193);g.lineTo(x+25,y-208);g.lineTo(x+25,y-180);g.fill()}function player(){g.save();if(p.inv&&Math.floor(t/4)%2)g.globalAlpha=.4;circ(p.x,p.y-42,20,'#fff0d0');rect(p.x-15,p.y-30,30,25,'#d94b35');circ(p.x-7,p.y-46,3,'#1b1209','',0);circ(p.x+7,p.y-46,3,'#1b1209','',0);line(p.x-9,p.y-5,p.x-15,p.y+1);line(p.x+9,p.y-5,p.x+15,p.y+1);g.restore()}function burst(x,y,col,n=7){for(let i=0;i<n;i++){let a=Math.random()*7,s=1+Math.random()*4;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:24,col})} }function fire(){let w=wp[weapon],a=p.face,ox=p.x+a*27,oy=p.y-38;if(w[3]==='spread'){for(let i=-2;i<=2;i++){let an=i*.17;bullets.push({x:ox,y:oy,vx:a*Math.cos(an)*16,vy:Math.sin(an)*16,d:w[4],col:w[1],life:45})}}else bullets.push({x:ox,y:oy,vx:a*(w[3]==='home'?10:18),vy:0,d:w[4],col:w[1],life:110,home:w[3]==='home'});p.sc=w[2]}function update(){t++;if(state==='menu'){if(hit('jump')||hit('shoot'))reset();return}if(state==='pause'){if(hit('jump')||hit('shoot'))state='fight';return}if(state!=='fight')return;let d=(held('right')?1:0)-(held('left')?1:0);if(d)p.face=d;if(p.dash){p.dash--;p.vx=p.face*14;p.vy=0}else{p.vx+=(d*5.5-p.vx)*.35;if(hit('dash')&&p.dc<=0){p.dash=12;p.dc=48;burst(p.x,p.y-20,'#fff1cc')}}if(p.dc)p.dc--;if(hit('jump')){if(p.on){p.vy=-16.5;p.on=false}else{let s=shots.find(z=>z.pink&&Math.hypot(z.x-p.x,z.y-p.y+30)<45);if(s){s.dead=true;p.card=Math.min(5,p.card+1);p.vy=-13;msg='PARRY! +1 EX';burst(p.x,p.y-30,'#ff6fb5',14)}}}p.vy=Math.min(p.vy+.82,16);p.x=Math.max(22,Math.min(938,p.x+p.vx));p.y+=p.vy;if(p.y>=F){p.y=F;p.vy=0;p.on=true}if(p.inv)p.inv--;if(p.sc)p.sc--;if(held('shoot')&&!p.sc)fire();if(hit('weapon'))weapon=(weapon+1)%3;if(hit('ex')&&p.card){p.card--;bullets.push({x:p.x,y:p.y-38,vx:p.face*14,vy:0,d:18,col:'#f2b632',life:100,ex:true})}b.t++;b.flash=Math.max(0,b.flash-1);b.x=770+Math.sin(b.t*.018)*32;b.timer--;if(b.timer<=0){b.mode=b.phase===1?'spit':'rain';b.timer=b.phase===1?100:90;b.n=0}if(b.mode==='spit'&&b.timer%19===0&&b.n<4){let a=Math.atan2(-5,p.x-b.x);shots.push({x:b.x-65,y:F-105,vx:Math.cos(a)*5.3,vy:Math.sin(a)*5.3,r:14,pink:b.n===3,life:240});b.n++}if(b.mode==='rain'&&b.timer%12===0&&b.n<7){let x=80+Math.random()*800;shots.push({x,y:-10,vx:(p.x-x)*.002,vy:3.5,r:13,pink:b.n===2||b.n===6,life:240});b.n++}if(b.timer<=0){b.mode='idle';b.timer=b.phase===1?65:48}for(let z of bullets){if(z.home){let a=Math.atan2(F-100-z.y,b.x-z.x);z.vx+=Math.cos(a)*.25;z.vy+=Math.sin(a)*.25;let m=Math.hypot(z.vx,z.vy);z.vx=z.vx/m*11;z.vy=z.vy/m*11}z.x+=z.vx;z.y+=z.vy;z.life--;if(Math.hypot(z.x-b.x,z.y-(F-100))<95){b.hp-=z.d;z.life=0;b.flash=4;score+=z.d;burst(z.x,z.y,z.col,3)}}bullets=bullets.filter(z=>z.life>0&&z.x>-30&&z.x<W+30);if(b.hp<=b.max*.5)b.phase=2;if(b.hp<=0){state='win';best=Math.max(best,score|0);localStorage.caycikBest=best}for(let s of shots){s.x+=s.vx;s.y+=s.vy;if(s.y>F-s.r&&s.vy>0){s.y=F-s.r;s.vy=-Math.abs(s.vy)*.7}if(s.pink&&s.y>F-40)s.vy=-Math.abs(s.vy)-1;if(p.inv<=0&&p.dash<=0&&Math.hypot(s.x-p.x,s.y-(p.y-28))<s.r+15){p.hp--;p.inv=85;burst(p.x,p.y-30,'#d94b35',12);if(p.hp<=0)state='dead'}if(--s.life<=0)s.dead=true}shots=shots.filter(s=>!s.dead&&s.x>-60&&s.x<W+60&&s.y<H+60);for(let z of fx){z.x+=z.vx;z.y+=z.vy;z.vy+=.1;z.life--}fx=fx.filter(z=>z.life>0)}function bar(x,y,w,h,v,col){rect(x,y,w,h,'#3a2116');rect(x+3,y+3,(w-6)*Math.max(0,v),h-6,col);g.strokeStyle='#1b1209';g.lineWidth=2;g.strokeRect(x,y,w,h)}function draw(){bg();if(state==='menu'){txt('ÇAYCIK',480,160,70);txt('BOSS SAVAŞI',480,210,30,'#f2b632');circ(480,310,56,'#69b043');circ(460,300,12,'#fff');circ(500,300,12,'#fff');txt('BAŞLAMAK İÇİN DOKUN / SPACE',480,430,22);txt('Tarayıcı sürümü · Dokunmatik kontroller hazır',480,470,15,'#f5d9a0');return}frog();player();for(let s of shots){circ(s.x,s.y,s.r,s.pink?'#ff6fb5':'#f2b632');if(s.pink)circ(s.x,s.y,s.r*.45,'#fff1cc','',0)}for(let z of bullets)circ(z.x,z.y,z.ex?17:6,z.col,'#1b1209',z.ex?3:1);for(let z of fx)circ(z.x,z.y,Math.max(1,z.life/5),z.col,'',0);bar(290,22,380,17,b.hp/b.max,'#c8372d');txt('KURBAĞA KRAL',480,16,13,'#21160f');for(let i=0;i<3;i++)txt(i<p.hp?'♥':'♡',38+i*30,45,25,'#c8372d');txt('EX '+ '▰'.repeat(p.card)+'▱'.repeat(5-p.card),850,42,17,'#f2b632');txt(wp[weapon][0],480,515,15);if(msg)txt(msg,480,100,24,'#ff6fb5');if(['pause','dead','win'].includes(state)){rect(0,0,W,H,'#160d09bb');txt(state==='pause'?'DURAKLATILDI':state==='dead'?'ÖLDÜN!':'ZAFER!',480,220,55);txt(state==='pause'?'Devam için ZIPLA / ATEŞ':state==='dead'?'Tekrar için ZIPLA / ATEŞ':'Kurbağa Kral yenildi!',480,285,22,'#f2b632');if(state!=='pause')txt('En iyi skor: '+best,480,340,18)}}function loop(){update();draw();pressed={};requestAnimationFrame(loop)}reset();state='menu';loop()})();
</script></body></html>
